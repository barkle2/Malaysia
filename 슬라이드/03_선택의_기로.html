<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Which Way Should I Go?</title>
  <style>
    :root {
      --navy: #101f45;
      --red: #bd213d;
      --gold: #f2c84b;
      --paper: #faf9f5;
      --muted: #46546b;
      --rule: #cdd2db;
      --surround: #e4e7ed;
      --font-sans: Aptos, "Segoe UI", Arial, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      background: var(--surround);
      color: var(--navy);
      font-family: var(--font-sans);
    }

    .slide {
      container-type: inline-size;
      width: min(100vw, calc(100dvh * 16 / 9));
      aspect-ratio: 16 / 9;
      background: var(--paper);
      background-image: linear-gradient(
        to right,
        var(--navy) 0 84%,
        var(--red) 84% 97%,
        var(--gold) 97% 100%
      );
      background-repeat: no-repeat;
      background-size: 100% 0.98%;
    }

    .slide__layout {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      width: 100%;
      height: 100%;
      padding: 2.55cqw 5cqw 2.75cqw;
    }

    .slide__header,
    .slide__footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2cqw;
    }

    .slide__header {
      border-bottom: 1px solid var(--rule);
      padding-bottom: 1.45cqw;
    }

    .slide__header p,
    .slide__footer p {
      margin: 0;
    }

    .programme {
      font-size: 1.45cqw;
      font-weight: 700;
    }

    .session {
      color: var(--muted);
      font-size: 1.4cqw;
      font-weight: 600;
      text-align: right;
    }

    .crossroads {
      display: grid;
      align-content: center;
      gap: 1.35cqw;
      min-height: 0;
    }

    .crossroads__title {
      margin: 0;
      font-size: 3.8cqw;
      font-weight: 750;
      letter-spacing: -0.035em;
      line-height: 1.02;
    }

    .crossroads__title::before {
      display: block;
      width: 3.5cqw;
      height: 0.32cqw;
      margin-bottom: 0.9cqw;
      background: var(--red);
      content: "";
    }

    .scene {
      position: relative;
      isolation: isolate;
      width: 100%;
      height: 34.5cqw;
      overflow: hidden;
      background: #f2e2c4;
    }

    .scene__ground {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      z-index: -1;
    }

    .choice {
      position: absolute;
      top: 39%;
      width: 29%;
      padding-top: 0.85cqw;
    }

    .choice--left {
      left: 5%;
      width: 35%;
    }

    .choice--right {
      right: 1%;
      width: 31%;
    }

    .choice--right h2 {
      white-space: nowrap;
    }

    .choice::before {
      position: absolute;
      top: 0;
      left: 0;
      width: 2.65cqw;
      height: 0.22cqw;
      background: var(--navy);
      content: "";
      transition: width 200ms ease, background-color 200ms ease;
    }

    .choice h2 {
      margin: 0;
      font-size: 2.22cqw;
      font-weight: 750;
      letter-spacing: -0.025em;
      line-height: 1.08;
      text-wrap: balance;
    }

    .choice p {
      max-width: 21cqw;
      margin: 0.6cqw 0 0;
      color: var(--muted);
      font-size: 1.55cqw;
      line-height: 1.28;
      text-wrap: pretty;
    }

    .scene__speaker {
      position: absolute;
      top: 91%;
      left: 50%;
      width: 11cqw;
      height: 46%;
      transform: translate(-50%, -100%);
      transform-origin: center bottom;
      pointer-events: none;
    }

    .scene__frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center bottom;
    }

    .scene__frame--first-step,
    .scene__frame--second-step,
    .has-choice .scene__frame--thinking {
      opacity: 0;
    }

    .has-choice .scene__frame--first-step {
      animation: first-step 310ms steps(1, end) 5;
    }

    .has-choice .scene__frame--second-step {
      opacity: 1;
      animation: second-step 310ms steps(1, end) 5;
    }

    @keyframes first-step {
      0% { opacity: 1; transform: translateY(-2%); }
      50%, 100% { opacity: 0; }
    }

    @keyframes second-step {
      0% { opacity: 0; }
      50%, 100% { opacity: 1; }
    }

    .scene__trigger {
      position: absolute;
      right: 3%;
      bottom: 6%;
      border: 0;
      border-bottom: 1px solid currentColor;
      padding: 0 0 0.24cqw;
      background: transparent;
      color: var(--navy);
      font-family: inherit;
      font-size: 1.26cqw;
      font-weight: 650;
      cursor: pointer;
    }

    .scene__trigger:focus-visible {
      outline: 2px solid var(--navy);
      outline-offset: 0.3cqw;
    }

    .scene__status {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    .has-choice .choice--right::before {
      width: 4.6cqw;
      height: 0.36cqw;
      background: var(--red);
    }

    .has-choice .scene__speaker {
      top: 33%;
      left: 65.5%;
      transform: translate(-50%, -100%) scale(0.65);
      animation: take-right-path 1.55s ease-in-out both;
    }

    @keyframes take-right-path {
      0% {
        top: 91%;
        left: 50%;
        transform: translate(-50%, -100%) scale(1);
      }

      36% {
        top: 63%;
        left: 50%;
        transform: translate(-50%, -100%) scale(0.87);
      }

      65% {
        top: 47%;
        left: 55.6%;
        transform: translate(-50%, -100%) scale(0.75);
      }

      100% {
        top: 33%;
        left: 65.5%;
        transform: translate(-50%, -100%) scale(0.65);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .has-choice .scene__speaker,
      .has-choice .scene__frame {
        animation: none;
      }

      .choice::before {
        transition: none;
      }
    }

    @media print {
      .scene__trigger {
        display: none;
      }
    }

    .slide__footer {
      justify-content: flex-end;
      border-top: 1px solid var(--rule);
      padding-top: 1.42cqw;
    }

    .slide__page {
      color: var(--muted);
      font-size: 1.4cqw;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      line-height: 1.25;
    }

    @page {
      size: 13.3333in 7.5in;
      margin: 0;
    }

    @media print {
      html {
        print-color-adjust: exact;
      }

      body {
        display: block;
        min-height: 0;
        background: white;
      }

      .slide {
        width: 100%;
      }
    }
  </style>
</head>
