<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Adoption at Korea’s Ministry of Employment and Labor</title>
  <style>
    :root {
      --navy: #101f45;
      --red: #bd213d;
      --gold: #f2c84b;
      --paper: #faf9f5;
      --muted: #46546b;
      --rule: #cdd2db;
      --surround: #e4e7ed;
      --font-sans: Aptos, "Segoe UI", Arial, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      background: var(--surround);
      color: var(--navy);
      font-family: var(--font-sans);
    }

    .slide {
      container-type: inline-size;
      width: min(100vw, calc(100dvh * 16 / 9));
      aspect-ratio: 16 / 9;
      background: var(--paper);
      background-image: linear-gradient(
        to right,
        var(--navy) 0 84%,
        var(--red) 84% 97%,
        var(--gold) 97% 100%
      );
      background-repeat: no-repeat;
      background-size: 100% 0.98%;
    }

    .slide__layout {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      width: 100%;
      height: 100%;
      padding: 2.55cqw 5cqw 2.75cqw;
    }

    .slide__header,
    .slide__footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2cqw;
    }

    .slide__header {
      border-bottom: 1px solid var(--rule);
      padding-bottom: 1.45cqw;
    }

    .slide__header p,
    .slide__footer p {
      margin: 0;
    }

    .programme {
      font-size: 1.45cqw;
      font-weight: 700;
    }

    .session {
      color: var(--muted);
      font-size: 1.4cqw;
      font-weight: 600;
      text-align: right;
    }

    .slide__session {
      display: flex;
      align-items: center;
      gap: 1.5cqw;
    }

    .session__art {
      display: block;
      width: 7.4cqw;
      height: auto;
    }

    .cover {
      display: grid;
      align-items: center;
      padding-block: 2.4cqw;
    }

    .cover__copy::before {
      display: block;
      width: 3.5cqw;
      height: 0.32cqw;
      margin-bottom: 1.7cqw;
      background: var(--red);
      content: "";
    }

    .cover h1 {
      margin: 0;
      font-size: 5.45cqw;
      font-weight: 750;
      letter-spacing: -0.035em;
      line-height: 1.02;
    }

    .cover__subtitle {
      margin: 1.6cqw 0 0;
      color: var(--muted);
      font-size: 2.05cqw;
      line-height: 1.26;
    }

    .slide__footer {
      border-top: 1px solid var(--rule);
      padding-top: 1.42cqw;
    }

    .speaker__name {
      font-size: 1.75cqw;
      font-weight: 700;
      line-height: 1.15;
    }

    .speaker__team,
    .slide__date {
      color: var(--muted);
      font-size: 1.4cqw;
      line-height: 1.25;
    }

    .slide__footer .speaker__team {
      margin-top: 0.26cqw;
    }

    .slide__date {
      font-weight: 600;
      white-space: nowrap;
    }

    @page {
      size: 13.3333in 7.5in;
      margin: 0;
    }

    @media print {
      html {
        print-color-adjust: exact;
      }

      body {
        display: block;
        min-height: 0;
        background: white;
      }

      .slide {
        width: 100%;
      }
    }
  </style>
</head>
