<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thank You</title>
  <style>
    :root {
      --navy: #101f45;
      --red: #bd213d;
      --gold: #f2c84b;
      --paper: #faf9f5;
      --muted: #46546b;
      --rule: #cdd2db;
      --surround: #e4e7ed;
      --font-sans: Aptos, "Segoe UI", Arial, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      background: var(--surround);
      color: var(--navy);
      font-family: var(--font-sans);
    }

    .slide {
      container-type: inline-size;
      width: min(100vw, calc(100dvh * 16 / 9));
      aspect-ratio: 16 / 9;
      background: var(--paper);
      background-image: linear-gradient(
        to right,
        var(--navy) 0 84%,
        var(--red) 84% 97%,
        var(--gold) 97% 100%
      );
      background-repeat: no-repeat;
      background-size: 100% 0.98%;
    }

    .slide__layout {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      width: 100%;
      height: 100%;
      padding: 2.55cqw 5cqw 2.75cqw;
    }

    .slide__header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2cqw;
    }

    .slide__header {
      border-bottom: 1px solid var(--rule);
      padding-bottom: 1.45cqw;
    }

    .slide__header p {
      margin: 0;
    }

    .programme {
      font-size: 1.45cqw;
      font-weight: 700;
    }

    .session {
      color: var(--muted);
      font-size: 1.4cqw;
      font-weight: 600;
      text-align: right;
    }

    .thanks {
      display: grid;
      justify-items: center;
      align-content: center;
      gap: 1.6cqw;
      min-height: 0;
      text-align: center;
    }

    .thanks__title {
      margin: 0;
      font-size: 7.1cqw;
      font-weight: 750;
      letter-spacing: -0.052em;
      line-height: 1.02;
    }

    .thanks__title::before {
      display: block;
      width: 4.1cqw;
      height: 0.32cqw;
      margin: 0 auto 1.45cqw;
      background: var(--red);
      content: "";
    }

    .thanks__message {
      margin: 0;
      color: var(--muted);
      font-size: 2.08cqw;
      line-height: 1.32;
    }

    .thanks__message-lead {
      white-space: nowrap;
    }

    .slide__footer {
      min-height: 3.25cqw;
      border-top: 1px solid var(--rule);
    }


    @page {
      size: 13.3333in 7.5in;
      margin: 0;
    }

    @media print {
      html {
        print-color-adjust: exact;
      }

      body {
        display: block;
        min-height: 0;
        background: white;
      }

      .slide {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="slide" aria-labelledby="thanks-title">
    <div class="slide__layout">
      <header class="slide__header">
        <p class="programme">Malaysia Strategic Leadership Programme</p>
        <p class="session">Dialogue with Korean Civil Servants</p>
      </header>

      <section class="thanks" aria-labelledby="thanks-title">
        <h1 class="thanks__title" id="thanks-title">Thank You</h1>
        <p class="thanks__message"><span class="thanks__message-lead">Building AI in-house is one example of how organizations adapt.</span><br>Change starts when people try something new.</p>
      </section>

      <footer class="slide__footer"></footer>
    </div>
  </main>
</body>
</html>
